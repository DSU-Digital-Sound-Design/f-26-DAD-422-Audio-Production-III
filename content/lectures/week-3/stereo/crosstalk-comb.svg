<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img"
     aria-label="Left: both loudspeakers emit the same signal with no delay between them, yet both reach the left ear, the far one 0.26 milliseconds later after passing around the head. Right: the resulting comb response, with an 11 decibel notch near 2 kilohertz and shallower notches above it.">
