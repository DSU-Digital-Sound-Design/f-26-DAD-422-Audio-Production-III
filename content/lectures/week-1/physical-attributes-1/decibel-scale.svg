<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img"
     aria-label="A horizontal bar chart of common sound levels in decibels: threshold of hearing at 0, normal conversation at 60, city traffic at 80, a live rock band at the pain threshold at 120, and a rocket launch at 180. A dashed line at 85 dB marks where sustained exposure begins to risk hearing damage.">
  <!-- Palette matches reveal-console.css. The accent (DAD 422: #6ec1ff) is
       hardcoded because CSS variables do not reach an img-embedded SVG.
       Bars run left to right from x=175 at 1.1389 px per dB, so nothing can
       collide with the labels, which are right-aligned in their own column. -->
  <g font-family="JetBrains Mono, ui-monospace, Menlo, monospace" fill="#b7c2b3">

    <!-- Level names, right-aligned clear of the plot area -->
    <g font-size="11" text-anchor="end">
      <text x="168.0" y="49">Threshold of hearing</text>
      <text x="168.0" y="82">Normal conversation</text>
      <text x="168.0" y="115">City traffic</text>
      <text x="168.0" y="148">Live rock band (pain)</text>
      <text x="168.0" y="181">Rocket launch</text>
    </g>

    <!-- Bars -->
    <g fill="#6ec1ff">
      <rect x="175.0" y="39.5" width="3.0" height="11" rx="1.5"/>
      <rect x="175.0" y="72.5" width="68.3" height="11" rx="1.5"/>
      <rect x="175.0" y="105.5" width="91.1" height="11" rx="1.5"/>
      <rect x="175.0" y="138.5" width="136.7" height="11" rx="1.5"/>
      <rect x="175.0" y="171.5" width="205.0" height="11" rx="1.5"/>
    </g>

    <!-- Hearing-damage threshold -->
    <line x1="271.8" y1="30" x2="271.8" y2="215" stroke="#6d786a"
          stroke-width="1" stroke-dasharray="3 4"/>
    <text x="271.8" y="24" font-size="10" fill="#6d786a" text-anchor="middle">85 dB damage risk</text>

    <!-- Axis -->
    <line x1="175.0" y1="215" x2="380.0" y2="215" stroke="#6d786a" stroke-width="1.5"/>
    <g stroke="#6d786a" stroke-width="1.5">
      <line x1="175.0" y1="215" x2="175.0" y2="221"/>
      <line x1="243.3" y1="215" x2="243.3" y2="221"/>
      <line x1="311.7" y1="215" x2="311.7" y2="221"/>
      <line x1="380.0" y1="215" x2="380.0" y2="221"/>
    </g>
    <g font-size="11" fill="#6d786a" text-anchor="middle">
      <text x="175.0" y="236">0</text>
      <text x="243.3" y="236">60</text>
      <text x="311.7" y="236">120</text>
      <text x="380.0" y="236">180</text>
    </g>
    <text x="277.5" y="258" font-size="11" fill="#6d786a"
          text-anchor="middle" letter-spacing="0.08em">DECIBELS (dB SPL)</text>
  </g>
</svg>
