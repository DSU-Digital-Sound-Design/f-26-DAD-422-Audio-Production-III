<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img"
     aria-label="A point moving around a circle at constant speed. Its height above the centre line is marked, and that same height traced against time to the right gives a sine wave.">
  <!-- Palette matches reveal-console.css. The accent (DAD 422: #6ec1ff) is
       hardcoded because CSS variables do not reach an img-embedded SVG.
       Circle centre (80,150) radius 55; the wave starts at x=190 sharing the
       point's phase, so the marked height is literally the wave's first value. -->
  <g font-family="JetBrains Mono, ui-monospace, Menlo, monospace" fill="#b7c2b3">

    <!-- Centre line, running under both halves -->
    <line x1="20" y1="150" x2="382" y2="150" stroke="#6d786a" stroke-width="1"/>

    <!-- The circle and the rotating radius -->
    <circle cx="80" cy="150" r="55" fill="none" stroke="#6d786a" stroke-width="1.5"/>
    <line x1="80" y1="150" x2="111.5" y2="104.9" stroke="#6ec1ff" stroke-width="2.5"/>
    <circle cx="111.5" cy="104.9" r="5" fill="#6ec1ff"/>

    <!-- Carry the point's height across to where the wave begins -->
    <line x1="111.5" y1="104.9" x2="190" y2="104.9" stroke="#6d786a"
          stroke-width="1" stroke-dasharray="3 3"/>

    <!-- The height itself, marked as a span with end ticks -->
    <g stroke="#b7c2b3" stroke-width="1">
      <line x1="190" y1="104.9" x2="190" y2="150"/>
      <line x1="186" y1="104.9" x2="194" y2="104.9"/>
      <line x1="186" y1="150" x2="194" y2="150"/>
    </g>
    <text x="181" y="131.5" font-size="12" text-anchor="end">height</text>

    <!-- The wave that height traces out over time -->
    <polyline fill="none" stroke="#6ec1ff" stroke-width="2.5" stroke-linejoin="round" points="
              190.0,104.9 191.0,103.7 192.0,102.5 193.0,101.4 194.0,100.4 195.0,99.4 196.0,98.6
              197.0,97.8 198.0,97.1 199.0,96.6 200.0,96.1 201.0,95.7 202.0,95.4 203.0,95.1 204.0,95.0
              205.0,95.0 206.0,95.1 207.0,95.2 208.0,95.5 209.0,95.8 210.0,96.3 211.0,96.8 212.0,97.4
              213.0,98.1 214.0,98.9 215.0,99.8 216.0,100.8 217.0,101.9 218.0,103.0 219.0,104.2
              220.0,105.5 221.0,106.9 222.0,108.4 223.0,109.9 224.0,111.5 225.0,113.1 226.0,114.8
              227.0,116.6 228.0,118.5 229.0,120.3 230.0,122.3 231.0,124.3 232.0,126.3 233.0,128.4
              234.0,130.5 235.0,132.6 236.0,134.8 237.0,137.0 238.0,139.2 239.0,141.4 240.0,143.7
              241.0,146.0 242.0,148.2 243.0,150.5 244.0,152.8 245.0,155.0 246.0,157.3 247.0,159.6
              248.0,161.8 249.0,164.0 250.0,166.2 251.0,168.3 252.0,170.5 253.0,172.6 254.0,174.6
              255.0,176.6 256.0,178.6 257.0,180.5 258.0,182.4 259.0,184.2 260.0,185.9 261.0,187.6
              262.0,189.2 263.0,190.8 264.0,192.3 265.0,193.7 266.0,195.1 267.0,196.3 268.0,197.5
              269.0,198.6 270.0,199.6 271.0,200.6 272.0,201.4 273.0,202.2 274.0,202.9 275.0,203.4
              276.0,203.9 277.0,204.3 278.0,204.6 279.0,204.9 280.0,205.0 281.0,205.0 282.0,204.9
              283.0,204.8 284.0,204.5 285.0,204.2 286.0,203.7 287.0,203.2 288.0,202.6 289.0,201.9
              290.0,201.1 291.0,200.2 292.0,199.2 293.0,198.1 294.0,197.0 295.0,195.8 296.0,194.5
              297.0,193.1 298.0,191.6 299.0,190.1 300.0,188.5 301.0,186.9 302.0,185.2 303.0,183.4
              304.0,181.5 305.0,179.7 306.0,177.7 307.0,175.7 308.0,173.7 309.0,171.6 310.0,169.5
              311.0,167.4 312.0,165.2 313.0,163.0 314.0,160.8 315.0,158.6 316.0,156.3 317.0,154.0
              318.0,151.8 319.0,149.5 320.0,147.2 321.0,145.0 322.0,142.7 323.0,140.4 324.0,138.2
              325.0,136.0 326.0,133.8 327.0,131.7 328.0,129.5 329.0,127.4 330.0,125.4 331.0,123.4
              332.0,121.4 333.0,119.5 334.0,117.6 335.0,115.8 336.0,114.1 337.0,112.4 338.0,110.8
              339.0,109.2 340.0,107.7 341.0,106.3 342.0,104.9 343.0,103.7 344.0,102.5 345.0,101.4
              346.0,100.4 347.0,99.4 348.0,98.6 349.0,97.8 350.0,97.1 351.0,96.6 352.0,96.1 353.0,95.7
              354.0,95.4 355.0,95.1 356.0,95.0 357.0,95.0 358.0,95.1 359.0,95.2 360.0,95.5 361.0,95.8
              362.0,96.3 363.0,96.8 364.0,97.4 365.0,98.1 366.0,98.9 367.0,99.8 368.0,100.8
              369.0,101.9 370.0,103.0 371.0,104.2 372.0,105.5 373.0,106.9 374.0,108.4 375.0,109.9
              376.0,111.5 377.0,113.1 378.0,114.8 379.0,116.6 380.0,118.5
    "/>

    <text x="80" y="235" font-size="11" fill="#6d786a" text-anchor="middle">circular motion</text>
    <text x="288" y="235" font-size="11" fill="#6d786a" text-anchor="middle">simple harmonic motion</text>
    <text x="288" y="256" font-size="10" fill="#6d786a" text-anchor="middle" letter-spacing="0.08em">TIME &#8594;</text>
  </g>
</svg>
