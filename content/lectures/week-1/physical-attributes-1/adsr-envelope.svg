<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img"
     aria-label="An ADSR envelope: amplitude rises from silence to a peak during the attack, falls to a lower sustain level during the decay, holds flat through the sustain, and falls back to silence during the release.">
  <!-- Palette matches reveal-console.css. The accent (DAD 422: #6ec1ff) is
       hardcoded because CSS variables do not reach an img-embedded SVG.
       Stage boundaries at x = 40, 120, 180, 290, 360. Floor y=240, peak y=60. -->
  <g font-family="JetBrains Mono, ui-monospace, Menlo, monospace" fill="#b7c2b3">

    <!-- Axes -->
    <line x1="40" y1="240" x2="375" y2="240" stroke="#6d786a" stroke-width="1.5"/>
    <line x1="40" y1="240" x2="40" y2="45" stroke="#6d786a" stroke-width="1.5"/>
    <text x="26" y="145" font-size="11" fill="#6d786a" text-anchor="middle"
          transform="rotate(-90 26 145)">AMPLITUDE</text>
    <text x="207" y="294" font-size="12" fill="#6d786a" text-anchor="middle"
          letter-spacing="0.08em">TIME</text>

    <!-- Stage boundaries -->
    <g stroke="#6d786a" stroke-width="1" stroke-dasharray="3 4">
      <line x1="120" y1="60"  x2="120" y2="240"/>
      <line x1="180" y1="140" x2="180" y2="240"/>
      <line x1="290" y1="140" x2="290" y2="240"/>
    </g>

    <!-- Sustain level guide -->
    <line x1="40" y1="140" x2="180" y2="140" stroke="#6d786a" stroke-width="1"
          stroke-dasharray="3 4"/>

    <!-- The envelope -->
    <polyline fill="none" stroke="#6ec1ff" stroke-width="3"
              stroke-linejoin="round" stroke-linecap="round"
              points="40,240 120,60 180,140 290,140 360,240"/>

    <!-- Stage labels, centred in each span -->
    <g font-size="14" text-anchor="middle" fill="#6ec1ff">
      <text x="80"  y="258">A</text>
      <text x="150" y="258">D</text>
      <text x="235" y="258">S</text>
      <text x="325" y="258">R</text>
    </g>
    <g font-size="10" text-anchor="middle" fill="#6d786a">
      <text x="80"  y="274">attack</text>
      <text x="150" y="274">decay</text>
      <text x="235" y="274">sustain</text>
      <text x="325" y="274">release</text>
    </g>

    <!-- Callouts -->
    <text x="120" y="50" font-size="11" text-anchor="middle">peak</text>
    <text x="186" y="127" font-size="11">sustain level</text>
  </g>
</svg>
