{{/*
  reveal-hugo's per-site end-of-body hook.

  Slides tagged {{< slide class="stepped" >}} reveal their top-level
  bullets one at a time. The class comes from the slide shortcode; this
  turns each bullet into a Reveal fragment without per-item markup.
*/}}
<script>
  document.querySelectorAll('.reveal .slides section.stepped > ul > li').forEach(function (li) {
    li.classList.add('fragment');
  });
</script>
